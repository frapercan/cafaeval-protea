name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[fast,dev]'

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

  test:
    name: Tests + parity (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[fast,test]'

      - name: Unit tests
        run: pytest tests -q

      - name: Parity harness (Phase B tolerance)
        env:
          CAFAEVAL_PARITY_PHASE: B
        run: pytest tests/diff -q

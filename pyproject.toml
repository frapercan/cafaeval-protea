[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cafaeval-protea"
version = "0.1.0"
authors = [
    {name = "Francisco Miguel Pérez Canales", email = "frapercan1@alum.us.es"},
]
maintainers = [
    {name = "Francisco Miguel Pérez Canales", email = "frapercan1@alum.us.es"},
]
description = "Speedup fork of cafaeval (CAFA-evaluator-PK) with a bit-exact parity harness"
readme = {file = "README.md", "content-type" = "text/markdown"}
requires-python = ">=3.9"
keywords = [
    "CAFA",
    "Gene Ontology",
    "protein function prediction",
    "Fmax",
    "Smin",
    "information accretion",
    "ontology",
]
license = {file = "LICENCE.md"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas",
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
# PyArrow enables the vectorised prediction-file parser (B3). Without it
# the package falls back to the legacy line-by-line loop automatically.
fast = ["pyarrow>=12"]
docs = ["sphinx>=7", "furo>=2024.1", "myst-parser>=2", "sphinx-copybutton>=0.5"]
test = ["pytest>=7"]
dev = ["ruff>=0.4", "mypy>=1.8", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/frapercan/cafaeval-protea"
Repository = "https://github.com/frapercan/cafaeval-protea"
Documentation = "https://cafaeval-protea.readthedocs.io"
Changelog = "https://github.com/frapercan/cafaeval-protea/blob/main/CHANGES.md"
Upstream = "https://github.com/BioComputingUP/CAFA-evaluator"
"Direct parent (PK)" = "https://github.com/claradepaolis/CAFA-evaluator-PK"
"Speedup source (T0chka)" = "https://github.com/T0chka/CAFA-evaluator-PK-speedup"

[tool.poetry]
packages = [{include = "cafaeval", from = "src"}]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=7"
furo = ">=2024.1"
myst-parser = ">=2"
sphinx-copybutton = ">=0.5"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 120
src = ["src", "bench", "tests"]

[tool.ruff.lint]
# Conservative on a numerics library: pyflakes (F) and a curated pycodestyle
# (E) subset only. We deliberately do not enable import-sorting or
# line-length autoformatting, which would churn the cherry-picked upstream
# kernels without changing behaviour.
select = ["F", "E4", "E7", "E9"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# pandas / numpy / pyarrow ship partial or no stubs; the fork does not
# annotate the numeric kernels, so run mypy in its default (non-strict)
# mode purely as an import-and-syntax gate.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
cafaeval = "cafaeval.__main__:command_line"

[tool.setuptools.package-data]
cafaeval = ["data/example/*", "data/example/predictions/*"]